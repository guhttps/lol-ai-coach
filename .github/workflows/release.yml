name: Release

# Uma tag vX.Y.Z gera o executável, roda os testes e publica a release com o .zip.
# Rodar manualmente (workflow_dispatch) só gera o .zip como artefato, para teste.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "from config import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne $env:TAG) {
            throw "A tag $env:TAG não corresponde a APP_VERSION ($version) em config.py."
          }

      - name: Build package
        shell: pwsh
        run: ./scripts/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: LoL_AI_Coach-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success) { throw "CHANGELOG.md não tem a seção [$version]." }
          $section.Groups[1].Value.Trim() | Set-Content release-notes.md -Encoding utf8
          $zip = (Get-ChildItem dist/*.zip).FullName
          gh release create $env:TAG $zip --title "LoL AI Coach $env:TAG" --notes-file release-notes.md
